<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student form</title>
</head>
<body>
    <header><h1>student form</h1></header>
    <main>
        <section>
            <form>
                <label for="name">Name :</label>
                <input type="text" id="name" placeholder="Enter your name">
                <br>

                <label for="email">Email :</label>
                <input type="email" id="email" placeholder="Enter your email">
            <br>

                <label for="password">Password :</label>
                <input type="password" id="password" placeholder="Enter your password">
                 <br>

                 <label for="gender">Gender :</label>
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
                <br>

                <label for="Date of birth">Date of birth :</label>
                <input type="date" id="dob">
                <br>

                <label for="skills">skills/intrest :</label>
                <textarea id="skills" placeholder="Enter your skills and interests"></textarea>
                <br>

                <label for="country">Country :</label>
                <select>
                    <option value="india">pakistan</option>
                    <option value="usa">USA</option>
                    <option value="uk">UK</option>
                    <option value="canada">Canada</option>
                    <option value="australia">Australia</option>
                    <option value="germany">Germany</option>
                    <option value="france">France</option>
                    <option value="japan">Japan</option>
                    <option value="china">China</option>
                </select>
                <br>
                <label for="intro">About Yourself :</label>
                <textarea id="intro" placeholder="Write something about yourself"></textarea>
                <br>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
</body>
</html>
